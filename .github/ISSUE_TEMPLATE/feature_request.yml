name: Feature request
description: Suggest an improvement or new capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the **problem and use case**, not a prescribed
        implementation — RootRay's scope is deliberately narrow, and the
        workflow gap matters more than the suggested fix.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow gap or friction you hit — e.g. what you were trying to do and where RootRay fell short.
      placeholder: When I …, I have to …, which means …
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: The kind of project/workflow this affects — framework, workspace shape, how often it comes up.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: A rough idea of the outcome you want — implementation details optional.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you use today.
    validations:
      required: false
