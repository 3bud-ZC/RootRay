[package]
name = "rootray-desktop"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "RootRay desktop shell"

[lib]
name = "rootray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rootray-core = { path = "../../../crates/rootray-core" }
