<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RootRay</title>
    <style>
      /* Pre-bundle splash: visible only while the JS bundle loads. React
         removes #boot-splash on mount — no artificial delay. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d1117;
        color: #8b98a9;
        font:
          13px/1.5 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #boot-splash img {
        width: 220px;
        image-rendering: pixelated;
      }
      #boot-splash .boot-tag {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      #boot-splash .boot-bar {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: #0a0e13;
        overflow: hidden;
      }
      #boot-splash .boot-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #ff6b0c;
        animation: boot-scan 1.1s ease-in-out infinite;
      }
      @keyframes boot-scan {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(300%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-bar::after {
          animation: none;
          transform: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <img src="/brand/splash.png" alt="" />
      <span class="boot-tag">See the source</span>
      <span class="boot-bar"></span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
