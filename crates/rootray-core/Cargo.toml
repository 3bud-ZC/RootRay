[package]
name = "rootray-core"
version = "0.1.0"
edition = "2021"
description = "RootRay native core: project detection, dev-server lifecycle, launchers, settings."

[dependencies]
getrandom = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "test-sleeper"
path = "src/bin/test-sleeper.rs"
