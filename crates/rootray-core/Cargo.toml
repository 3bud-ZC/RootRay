[package]
name = "rootray-core"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "RootRay native core: project detection, dev-server lifecycle, launchers, settings."

[dependencies]
getrandom = "0.3"
lol_html = "3"
notify = "8.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
thiserror = { workspace = true }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
] }

[[bin]]
name = "test-sleeper"
path = "src/bin/test-sleeper.rs"
